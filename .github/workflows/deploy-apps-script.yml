# Uploads the Google Apps Script (apps-script/) to the Leave Manager Google Sheet
# and publishes it as a new version of the existing web app deployment.
#
# One-time setup (see README → "Automatic Google script updates"):
#   Repository secrets:  CLASPRC_JSON  – the contents of ~/.clasprc.json after `clasp login` (clasp 2.4.2)
#                        SCRIPT_ID     – Apps Script editor → Project Settings → Script ID
# The web app's deployment ID is read from assets/config.js (API_URL), so the web address never changes.
name: Deploy Google Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script/**', 'assets/core.js', '.github/workflows/deploy-apps-script.yml']
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the one-time setup is done
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::notice::Automatic Google script updates aren't set up yet (secrets CLASPRC_JSON and SCRIPT_ID). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install clasp
        if: steps.check.outputs.ready == 'true'
        run: npm install -g @google/clasp@2.4.2

      - name: Prepare files
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          # Sanity-check the login file without printing it.
          node -e '
            let j; try { j = JSON.parse(require("fs").readFileSync(process.env.HOME + "/.clasprc.json", "utf8")); }
            catch (e) { console.log("::error::CLASPRC_JSON is not valid JSON – copy the whole file again."); process.exit(1); }
            const keys = Object.keys(j);
            const ok = (j.token && j.token.refresh_token) || (j.tokens && Object.keys(j.tokens).length);
            console.log("Login file keys: " + keys.join(", "));
            if (!ok) { console.log("::error::CLASPRC_JSON has no login token in it – run clasp login again and copy the new file."); process.exit(1); }
            if (j.tokens && !j.token) console.log("::warning::This login file looks like it was made by clasp 3, but this job uses clasp 2.4.2.");'
          # The shared leave rules must be identical on the website and in the script.
          cp assets/core.js apps-script/Core.gs
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > apps-script/.clasp.json
          DEPLOYMENT_ID=$(grep -o 'macros/s/[A-Za-z0-9_-]*/exec' assets/config.js | head -1 | sed 's#macros/s/##; s#/exec##')
          if [ -z "$DEPLOYMENT_ID" ]; then echo "::error::No Apps Script web app URL (API_URL) found in assets/config.js"; exit 1; fi
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Upload the script
        if: steps.check.outputs.ready == 'true'
        working-directory: apps-script
        run: |
          set -o pipefail
          if ! clasp push --force 2>&1 | tee /tmp/push.txt; then
            msg=$(tail -n 6 /tmp/push.txt | tr '\n' ' ' | sed -E 's/(token|secret)[^ ]*/\1:***/Ig')
            echo "::error::clasp push failed: $msg"
            exit 1
          fi

      - name: Publish a new version of the web app
        if: steps.check.outputs.ready == 'true'
        working-directory: apps-script
        run: |
          set -o pipefail
          if ! clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Leave Manager ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))" 2>&1 | tee /tmp/deploy.txt; then
            msg=$(tail -n 6 /tmp/deploy.txt | tr '\n' ' ')
            echo "::error::clasp deploy failed: $msg"
            exit 1
          fi

      - name: Summary
        if: steps.check.outputs.ready == 'true'
        run: echo "### Google script updated and published ✅" >> "$GITHUB_STEP_SUMMARY"
