plugins {
    id 'com.android.application'
}

// Version comes from the GitHub build number, so every new build installs over the last one.
def buildNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'org.christchurchhowick.leavemanager'
    compileSdk 34

    defaultConfig {
        applicationId 'org.christchurchhowick.leavemanager'
        minSdk 26
        targetSdk 34
        versionCode buildNo
        versionName "1.0." + buildNo
        // The web address the app opens. Change it here if the site ever moves.
        buildConfigField 'String', 'APP_URL', '"https://pian1966.github.io/leave-manager/"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'leavemanager'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android's built-in "Sign in with Google" (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
